version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: dashboards_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dashboards
    ports:
      - 5433:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboards_user -d dashboards"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  test_postgres:
    image: postgres:15
    container_name: test_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo
    ports:
      - 5434:5432
    networks:
      - app-network

  demo-mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: demo_user
      MONGO_INITDB_ROOT_PASSWORD: demo_pass
      MONGO_INITDB_DATABASE: analytics_demo
    ports:
      - "27018:27017"
    volumes:
      - ./demo_data/mongo_init.js:/docker-entrypoint-initdb.d/init.js
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 120s
      timeout: 5s
      retries: 2
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app/app
    env_file:
      - .env
    # volumes:
    #   - ./app:/app
    #   - /app/.venv
    # command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge